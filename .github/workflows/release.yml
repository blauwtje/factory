name: release

on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  create:
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release create "$TAG" --draft --generate-notes --title "Factory $TAG" --verify-tag
          echo "release_id=$(gh release view "$TAG" --json databaseId --jq .databaseId)" >> "$GITHUB_OUTPUT"

  build:
    needs: create
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: windows-latest
            args: --bundles msi,nsis
            targets: ""
          - platform: ubuntu-22.04
            args: --bundles deb,appimage
            targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca
        with:
          targets: ${{ matrix.targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: app/src-tauri
      - if: matrix.platform == 'ubuntu-22.04'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf build-essential cmake clang libssl-dev
      - run: npm ci
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          releaseId: ${{ needs.create.outputs.release_id }}
          tagName: ${{ github.ref_name }}
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  publish:
    needs: [create, build]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          dir="$(mktemp -d)"
          gh release download "$TAG" --pattern latest.json --dir "$dir"
          gh release view "$TAG" --json body --jq .body > "$dir/body.md"
          jq --rawfile notes "$dir/body.md" '.notes = $notes' "$dir/latest.json" > "$dir/out.json"
          mv "$dir/out.json" "$dir/latest.json"
          gh release upload "$TAG" "$dir/latest.json" --clobber
          gh release edit "$TAG" --draft=false
